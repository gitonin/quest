<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>La Quete des Trois Etoiles</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0a14'/%3E%3Cpath d='M8 2l1.6 4.4L14 8l-4.4 1.6L8 14l-1.6-4.4L2 8l4.4-1.6z' fill='%23f0c04a'/%3E%3C/svg%3E"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        width: 100%;
        min-height: 100%;
        overflow: hidden;
        /* Faint nebula so the letterbox around the 16:9 frame reads as
           deliberate rather than as a blank page. */
        background:
          radial-gradient(120% 80% at 50% 0%, #141034 0%, #08061a 45%, #05050c 100%);
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #game-root {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #game-canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
        background: #05050c;
        box-shadow: 0 0 0 1px #c9a227, 0 0 34px rgba(122, 92, 255, 0.28);
      }
      /* Bannière discrète: le jeu reste visible et jouable en portrait. */
      #rotate-hint {
        position: absolute;
        left: 50%;
        top: 8px;
        transform: translateX(-50%);
        display: none;
        background: rgba(20, 16, 36, 0.92);
        border: 1px solid #c9a227;
        color: #f4f0e4;
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-align: center;
        padding: 6px 10px;
        border-radius: 2px;
        z-index: 50;
        pointer-events: none;
      }
      body.portrait-warn #rotate-hint {
        display: block;
      }
      #boot-error {
        position: absolute;
        inset: 0;
        display: none;
        padding: 16px;
        color: #ff9f9f;
        background: #12060a;
        font-family: monospace;
        font-size: 12px;
        white-space: pre-wrap;
        overflow: auto;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div id="game-root">
      <canvas id="game-canvas"></canvas>
      <div id="rotate-hint">↻ Mode paysage recommandé</div>
    </div>
    <pre id="boot-error"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
