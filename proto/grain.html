<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e9e9e7" />
    <title>La Phrase</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      :root {
        --paper: #e9e9e7;
        --ink: #1b1b1d;
        --dim: #8a8a8d;
        --accent: #c8202a;
        --line: #b9b8b6;
      }
      html,
      body {
        width: 100%;
        min-height: 100%;
        overflow: hidden;
        background: var(--paper);
        transition: background 1.6s ease;
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #stage {
        position: relative;
        transition: background 1.6s ease;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: var(--paper);
      }
      #c {
        display: block;
        background: var(--paper);
      }
      #caption {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #6f6f70;
        text-align: center;
        pointer-events: none;
        transition: opacity 1.2s ease;
        mix-blend-mode: multiply;
      }
      #caption.gone {
        opacity: 0;
      }
      /* Tout le texte partage la même voix: petite, espacée, en noir sur le
         fond clair. Aucune boîte opaque, rien qui ressemble à un HUD de jeu. */
      #hud {
        position: absolute;
        top: calc(16px + env(safe-area-inset-top));
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 10px;
        align-items: center;
        font: 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--dim);
        pointer-events: none;
        mix-blend-mode: multiply;
      }
      #hud .phrase {
        display: flex;
        gap: 4px;
      }
      #hud .tick {
        width: 4px;
        height: 4px;
        background: var(--line);
      }
      #hud .tick.on {
        background: var(--accent);
      }
      /* Le titre d'un tableau: un seul mot, posé au milieu, qui s'efface. */
      #region {
        position: absolute;
        top: 40%;
        left: 0;
        right: 0;
        text-align: center;
        font: 26px/1.4 ui-monospace, Menlo, monospace;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        text-transform: lowercase;
        color: var(--ink);
        opacity: 0;
        transition: opacity 1.8s ease, letter-spacing 3s ease;
        pointer-events: none;
      }
      #region.show {
        letter-spacing: 0.52em;
        text-indent: 0.52em;
      }
      #region.show {
        opacity: 1;
      }
      #talk {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 14px 18px calc(16px + env(safe-area-inset-bottom));
        display: none;
        flex-direction: column;
        gap: 10px;
        background: linear-gradient(to top, var(--paper) 62%, transparent);
        font: 13px/1.55 ui-monospace, Menlo, monospace;
        color: var(--ink);
      }
      #talk.open {
        display: flex;
      }
      #talk .who {
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--dim);
      }
      #talk .line {
        max-width: 42em;
      }
      #talk .choices {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #talk button {
        font: inherit;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--line);
        padding: 11px 14px;
        min-height: 44px;
        cursor: pointer;
        letter-spacing: 0.04em;
      }
      #talk button:hover,
      #talk button:focus-visible {
        border-color: var(--accent);
        color: var(--accent);
        outline: none;
      }
      #ask {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 26%;
        text-align: center;
        font: 11px/1.6 ui-monospace, Menlo, monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s ease;
        mix-blend-mode: multiply;
      }
      #ask.show {
        opacity: 1;
      }
      #ask .bar {
        margin: 7px auto 0;
        width: 92px;
        height: 2px;
        background: var(--line);
      }
      #ask .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--accent);
      }
      /* Deux boutons de texte, minuscules, en bas à gauche. Rien d'autre. */
      /* En haut à droite: le bas de l'écran appartient aux dialogues. */
      #tools {
        position: absolute;
        right: 12px;
        top: calc(6px + env(safe-area-inset-top));
        display: flex;
        gap: 14px;
        font: 10px/1 ui-monospace, Menlo, monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      #tools button {
        font: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        color: var(--dim);
        background: transparent;
        border: 0;
        padding: 12px 4px;
        min-height: 44px;
        cursor: pointer;
      }
      #tools button:hover,
      #tools button:focus-visible {
        color: var(--accent);
        outline: none;
      }
      #score {
        position: absolute;
        inset: 0;
        padding-top: calc(54px + env(safe-area-inset-top));
        display: none;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        padding: 12px 22px calc(28px + env(safe-area-inset-bottom));
        background: var(--paper);
        font: 13px/1.5 ui-monospace, Menlo, monospace;
        color: var(--ink);
        overflow: auto;
      }
      #score.open {
        display: flex;
      }
      #score h2 {
        font: 10px/1 ui-monospace, Menlo, monospace;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--dim);
        font-weight: normal;
        margin-bottom: 14px;
      }
      #score button {
        font: inherit;
        color: var(--ink);
        background: transparent;
        border: 0;
        border-top: 1px solid var(--line);
        padding: 13px 2px;
        min-height: 48px;
        text-align: left;
        display: flex;
        gap: 14px;
        align-items: baseline;
        cursor: pointer;
        letter-spacing: 0.1em;
      }
      #score button .n {
        font-size: 10px;
        color: var(--dim);
        letter-spacing: 0.2em;
        min-width: 2.4em;
      }
      #score button.here .n {
        color: var(--accent);
      }
      #score button:hover,
      #score button:focus-visible {
        color: var(--accent);
        outline: none;
      }
      #err {
        position: absolute;
        inset: 0;
        display: none;
        padding: 16px;
        font: 12px/1.5 ui-monospace, Menlo, monospace;
        color: #b3242b;
        background: #f4f2f0;
        white-space: pre-wrap;
        overflow: auto;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="c"></canvas>
      <div id="hud"><span class="phrase" id="phrase"></span></div>
      <div id="region"></div>
      <div id="ask"><span id="ask-label"></span><span class="bar"><i id="ask-bar"></i></span></div>
      <div id="talk">
        <div class="who" id="talk-who"></div>
        <div class="line" id="talk-line"></div>
        <div class="choices" id="talk-choices"></div>
      </div>
      <div id="tools">
        <button type="button" id="btn-score">partition</button>
        <button type="button" id="btn-cam">◉ latérale</button>
      </div>
      <div id="score"><h2>la partition</h2></div>
      <div id="caption">glissez pour marcher · haut et bas pour entrer dans la profondeur</div>
      <pre id="err"></pre>
    </div>
    <script>
      (function () {
        'use strict';

        var stage = document.getElementById('stage');
        var hud = {
          phrase: document.getElementById('phrase'),
          region: document.getElementById('region'),
          talk: document.getElementById('talk'),
          who: document.getElementById('talk-who'),
          line: document.getElementById('talk-line'),
          choices: document.getElementById('talk-choices'),
          ask: document.getElementById('ask'),
          askLabel: document.getElementById('ask-label'),
          askBar: document.getElementById('ask-bar'),
          tools: document.getElementById('tools'),
          btnScore: document.getElementById('btn-score'),
          btnCam: document.getElementById('btn-cam'),
          score: document.getElementById('score')
        };
        var canvas = document.getElementById('c');
        var caption = document.getElementById('caption');
        var errBox = document.getElementById('err');
        var ctx = canvas.getContext('2d', { alpha: false });

        window.addEventListener('error', function (e) {
          errBox.style.display = 'block';
          errBox.textContent = e.message + '\n' + (e.filename || '') + ':' + (e.lineno || 0);
        });

        /* ------------------------------------------------------------------
         * Mise en scène.
         *
         * Tout est un grain: un petit cube de matière posé dans un volume.
         * La caméra est un objectif macro placé de côté, à hauteur du sol.
         * Un grain net est un carré aligné sur la grille; un grain hors du
         * plan de netteté devient un disque doux dont la surface grandit et
         * l'opacité baisse d'autant — c'est un cercle de confusion, pas un
         * flou appliqué à l'image. La trame appartient donc au monde, jamais
         * à l'écran: c'est ce qui fait lire "maquette filmée" plutôt que
         * "filtre".
         * ---------------------------------------------------------------- */
        var F = 520; // distance focale virtuelle
        var APERTURE = 0.055; // ouverture: plus grand, flou plus franc
        var GRAIN = 5; // côté d'un grain, en pixels au plan de netteté
        var CAM_H = 340; // hauteur de l'objectif: c'est elle qui étale la profondeur
        var CHUNK = 280; // largeur d'un morceau de monde
        var NOTE_SPACING = 26; // écart entre deux notes posées au sol
        /* ------------------------------------------------------ les tableaux
         * Le voyage est découpé en actes. Chacun change le papier, l'encre,
         * la teinte vive, le rythme des notes, le mode, la météo. On n'y
         * entre pas par une porte: on y entre en marchant, et un mot s'écrit
         * au milieu de l'image.
         */
        var ACT_LEN = 2600;
        var ACTS = [
          { word: 'sillon', paper: ['#f3f2f0', '#cfcecd'], ink: '#121214', accent: '#c8202a',
            tonic: 0, scale: [0, 3, 5, 7, 10], spacing: 26, weather: 'clair', wet: 0.4 },
          { word: 'duvet', paper: ['#f6f4ee', '#d8d5cc'], ink: '#1a1a18', accent: '#3f7a5e',
            tonic: 5, scale: [0, 2, 4, 7, 9], spacing: 20, weather: 'clair', wet: 0.32 },
          { word: 'averse', paper: ['#e7eaec', '#c3c8cc'], ink: '#15181a', accent: '#2a7f9e',
            tonic: -2, scale: [0, 2, 3, 5, 7], spacing: 22, weather: 'pluie', wet: 0.55 },
          { word: 'nuit', paper: ['#0b0c10', '#050507'], ink: '#dfe2e6', accent: '#e8d7a8',
            tonic: -7, scale: [0, 2, 3, 7, 8], spacing: 32, weather: 'orage', wet: 0.7, dark: true },
          { word: 'cendre', paper: ['#e2e0dc', '#b9b6b1'], ink: '#17161a', accent: '#a8442a',
            tonic: -4, scale: [0, 1, 5, 7, 10], spacing: 16, weather: 'vent', wet: 0.45 },
          { word: 'verre', paper: ['#f7f8fa', '#dde1e6'], ink: '#10131a', accent: '#6a84c8',
            tonic: 7, scale: [0, 2, 4, 7, 11], spacing: 18, weather: 'clair', wet: 0.5 },
          { word: 'seuil', paper: ['#f1efec', '#cbc7c1'], ink: '#131213', accent: '#c8202a',
            tonic: 3, scale: [0, 3, 5, 7, 10], spacing: 34, weather: 'clair', wet: 0.6 }
        ];

        function actIndexAt(x) {
          var i = Math.floor(x / ACT_LEN);
          return ((i % ACTS.length) + ACTS.length) % ACTS.length;
        }
        function actAt(x) {
          return ACTS[actIndexAt(x)];
        }

        var act = ACTS[0];
        var actIndex = 0;

        /* ------------------------------------------------------------------
         * Le son.
         *
         * Il n'y a pas de piste musicale: le monde EST la partition. Des notes
         * sont posées dans le décor, et la créature est la tête de lecture.
         * Avancer lit la phrase, reculer la joue à l'envers — sans rien
         * inverser, simplement parce qu'on croise les mêmes notes dans l'autre
         * sens. La profondeur choisit la voix: près, des cloches; au milieu,
         * la mélodie; loin, les basses, plus sourdes et plus réverbérées.
         * ---------------------------------------------------------------- */
        var Sound = (function () {
          var ac = null,
            master = null,
            tone = null, // passe-bas piloté par la profondeur
            echo = null,
            drone = null,
            droneGain = null,
            wetGain = null,
            noiseBuf = null,
            ready = false,
            voices = 0,
            lastAt = 0;

          var SCALE = [0, 3, 5, 7, 10]; // pentatonique mineure: jamais faux
          var tonic = 0;

          function unlock() {
            if (ready) {
              if (ac && ac.state === 'suspended') ac.resume();
              return;
            }
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            try {
              ac = new AC();
            } catch (e) {
              return;
            }
            master = ac.createGain();
            master.gain.value = 0.0001;
            master.connect(ac.destination);

            tone = ac.createBiquadFilter();
            tone.type = 'lowpass';
            tone.frequency.value = 5200;
            tone.Q.value = 0.4;
            tone.connect(master);

            // Réverbération pauvre mais crédible: un délai qui se remord la
            // queue, filtré pour qu'il s'éteigne dans le grave.
            var d = ac.createDelay(1.2);
            d.delayTime.value = 0.23;
            var fb = ac.createGain();
            fb.gain.value = 0.36;
            var dlp = ac.createBiquadFilter();
            dlp.type = 'lowpass';
            dlp.frequency.value = 1800;
            d.connect(dlp);
            dlp.connect(fb);
            fb.connect(d);
            wetGain = ac.createGain();
            wetGain.gain.value = 0.4;
            d.connect(wetGain);
            wetGain.connect(tone);
            echo = d;

            // Un peu de bruit blanc en réserve: la pluie et le tonnerre en
            // vivent.
            noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
            var nd = noiseBuf.getChannelData(0);
            for (var ni = 0; ni < nd.length; ni++) nd[ni] = Math.random() * 2 - 1;

            // Bourdon: la tonalité de la région, toujours là, très bas.
            drone = ac.createOscillator();
            var drone2 = ac.createOscillator();
            droneGain = ac.createGain();
            droneGain.gain.value = 0.05;
            drone.type = 'sine';
            drone2.type = 'sine';
            drone.frequency.value = freq(tonic - 24);
            drone2.frequency.value = freq(tonic - 24) * 1.005;
            drone.connect(droneGain);
            drone2.connect(droneGain);
            droneGain.connect(tone);
            drone.start();
            drone2.start();
            drone.__twin = drone2;

            master.gain.setTargetAtTime(0.85, ac.currentTime, 1.2);
            ready = true;
          }

          function freq(semi) {
            return 220 * Math.pow(2, semi / 12);
          }

          function degreeToSemi(deg) {
            var octave = Math.floor(deg / SCALE.length);
            var step = ((deg % SCALE.length) + SCALE.length) % SCALE.length;
            return tonic + SCALE[step] + octave * 12;
          }

          function play(kind, deg, vel, delaySec) {
            if (!ready || !ac) return;
            var now = ac.currentTime + (delaySec || 0);
            // Garde-fou: sur mobile, trop de voix simultanées saturent tout.
            if (now - lastAt < 0.045 || voices > 14) return;
            lastAt = now;

            var semi = degreeToSemi(deg);
            var f = freq(semi);
            var dur = 1;
            var type = 'triangle';
            if (kind === 'bell') {
              type = 'sine';
              f *= 2;
              dur = 1.9;
            } else if (kind === 'bass') {
              type = 'sine';
              f /= 2;
              dur = 2.6;
            }

            var o = ac.createOscillator();
            var g = ac.createGain();
            o.type = type;
            o.frequency.setValueAtTime(f, now);
            g.gain.setValueAtTime(0.0001, now);
            g.gain.exponentialRampToValueAtTime(Math.max(0.002, vel), now + (kind === 'bass' ? 0.09 : 0.006));
            g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
            o.connect(g);
            g.connect(tone);
            if (echo) g.connect(echo);
            o.start(now);
            o.stop(now + dur + 0.05);
            voices++;
            o.onended = function () {
              voices--;
            };
          }

          return {
            unlock: unlock,
            ready: function () {
              return ready;
            },
            note: play,
            // La profondeur assombrit tout: c'est l'équivalent sonore du flou.
            setDepth: function (z) {
              if (!ready) return;
              var t = Math.max(0, Math.min(1, (z + 80) / 260));
              tone.frequency.setTargetAtTime(6200 - t * 5100, ac.currentTime, 0.25);
              droneGain.gain.setTargetAtTime(0.035 + t * 0.07, ac.currentTime, 0.4);
            },
            setScale: function (sc) {
              SCALE = sc.slice();
            },
            setWet: function (w) {
              if (!ready) return;
              wetGain.gain.setTargetAtTime(w, ac.currentTime, 1.2);
            },
            /* Une voix. Pas des mots: des petites impulsions filtrées, très
             * basses en niveau, qui donnent à la créature un grain de parole
             * sans jamais couvrir la musique. */
            voice: function (seed, count, timbre) {
              if (!ready) return;
              var tb = timbre || { base: 620, span: 900, q: 3.5, rate: 0.058, wave: 'triangle', up: 12, gain: 0.03 };
              var r = makeRng(seed);
              var n = count || 9;
              for (var i = 0; i < n; i++) {
                var t = ac.currentTime + i * tb.rate;
                var o = ac.createOscillator();
                var g = ac.createGain();
                var bp = ac.createBiquadFilter();
                bp.type = 'bandpass';
                bp.frequency.value = tb.base + r.range(0, tb.span);
                bp.Q.value = tb.q;
                o.type = tb.wave;
                var f0 = freq(tonic + tb.up + SCALE[r.int(0, SCALE.length)]);
                o.frequency.setValueAtTime(f0, t);
                o.frequency.linearRampToValueAtTime(f0 * r.range(0.94, 1.08), t + 0.05);
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(tb.gain, t + 0.008);
                g.gain.exponentialRampToValueAtTime(0.0001, t + tb.rate * 0.92);
                o.connect(bp);
                bp.connect(g);
                g.connect(tone);
                o.start(t);
                o.stop(t + 0.09);
              }
            },
            /* Le petit bruit d'attache: une impulsion carrée très courte,
             * filtrée haut. Elle ne joue pas de note, elle dit "touché". */
            blip: function (level) {
              if (!ready) return;
              var t = ac.currentTime;
              var o = ac.createOscillator();
              var g = ac.createGain();
              var hp = ac.createBiquadFilter();
              hp.type = 'highpass';
              hp.frequency.value = 1400;
              o.type = 'square';
              o.frequency.setValueAtTime(2300 + Math.random() * 900, t);
              o.frequency.exponentialRampToValueAtTime(900, t + 0.03);
              g.gain.setValueAtTime(0.0001, t);
              g.gain.exponentialRampToValueAtTime(0.03 * (level || 1), t + 0.004);
              g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
              o.connect(hp);
              hp.connect(g);
              g.connect(tone);
              o.start(t);
              o.stop(t + 0.06);
            },
            /* Interface: deux marches carrées, franches, assumées numériques. */
            digital: function (up) {
              if (!ready) return;
              var t = ac.currentTime;
              for (var i = 0; i < 2; i++) {
                var o = ac.createOscillator();
                var g = ac.createGain();
                o.type = 'square';
                o.frequency.value = up ? 620 + i * 420 : 900 - i * 380;
                var at = t + i * 0.052;
                g.gain.setValueAtTime(0.0001, at);
                g.gain.exponentialRampToValueAtTime(0.028, at + 0.005);
                g.gain.exponentialRampToValueAtTime(0.0001, at + 0.05);
                o.connect(g);
                g.connect(tone);
                o.start(at);
                o.stop(at + 0.07);
              }
            },
            crack: function () {
              if (!ready || !noiseBuf) return;
              var t = ac.currentTime;
              var src = ac.createBufferSource();
              src.buffer = noiseBuf;
              var hp = ac.createBiquadFilter();
              hp.type = 'highpass';
              hp.frequency.value = 2200;
              var g = ac.createGain();
              g.gain.setValueAtTime(0.42, t);
              g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
              src.connect(hp);
              hp.connect(g);
              g.connect(master);
              src.start(t);
              src.stop(t + 0.3);
            },
            thunder: function (distance) {
              if (!ready || !noiseBuf) return;
              var t = ac.currentTime + (distance || 0.6);
              var src = ac.createBufferSource();
              src.buffer = noiseBuf;
              var lp2 = ac.createBiquadFilter();
              lp2.type = 'lowpass';
              lp2.frequency.setValueAtTime(900, t);
              lp2.frequency.exponentialRampToValueAtTime(90, t + 2.8);
              var g = ac.createGain();
              g.gain.setValueAtTime(0.0001, t);
              g.gain.exponentialRampToValueAtTime(0.5, t + 0.07);
              g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
              src.connect(lp2);
              lp2.connect(g);
              g.connect(master);
              src.start(t);
              src.stop(t + 3.3);
            },
            setTonic: function (semi) {
              tonic = semi;
              if (!ready) return;
              drone.frequency.setTargetAtTime(freq(semi - 24), ac.currentTime, 1.2);
              drone.__twin.frequency.setTargetAtTime(freq(semi - 24) * 1.005, ac.currentTime, 1.2);
            },
            // Un motif joué d'un coup: c'est la récompense d'une rencontre.
            motif: function (degs, kind, gap) {
              for (var i = 0; i < degs.length; i++) play(kind || 'bell', degs[i], 0.16, i * (gap || 0.14));
            }
          };
        })();

        var reduceMotion = window.matchMedia
          ? window.matchMedia('(prefers-reduced-motion: reduce)').matches
          : false;

        var W = 0,
          H = 0,
          DPR = 1,
          horizonY = 0,
          // Échelle de la scène: le cadrage doit être le même sur un écran
          // court et sur un grand, sinon le plan de netteté sort de l'image.
          unit = 1;

        function resize() {
          var r = stage.getBoundingClientRect();
          DPR = Math.min(2, window.devicePixelRatio || 1);
          W = Math.max(280, Math.round(r.width) || window.innerWidth);
          H = Math.max(200, Math.round(r.height) || window.innerHeight);
          canvas.width = Math.round(W * DPR);
          canvas.height = Math.round(H * DPR);
          canvas.style.width = W + 'px';
          canvas.style.height = H + 'px';
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          horizonY = Math.round(H * 0.2);
          unit = H / 720;
          buildStatics();
        }

        /* ----------------------------------------------------- aléatoire */
        function makeRng(seed) {
          var s = seed >>> 0;
          function next() {
            s = (s + 0x6d2b79f5) >>> 0;
            var t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          }
          return {
            next: next,
            range: function (a, b) {
              return a + next() * (b - a);
            },
            int: function (a, b) {
              return Math.floor(a + next() * (b - a));
            },
            chance: function (p) {
              return next() < p;
            }
          };
        }

        /* ------------------------------------------------- disques de flou
         * Un jeu de sprites doux, réutilisés pour tous les grains hors
         * netteté: quelques canvas au total au lieu d'un dégradé recalculé
         * des milliers de fois par image.
         */
        var RADII = [2, 3, 4.5, 6.5, 9, 12.5, 17, 23, 31, 42, 56];
        var discsInk = [];
        var discsRed = [];

        function buildDisc(radius, color, softness) {
          var size = Math.ceil(radius * 2) + 2;
          var cv = document.createElement('canvas');
          cv.width = size;
          cv.height = size;
          var c = cv.getContext('2d');
          var g = c.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
          g.addColorStop(0, color);
          g.addColorStop(softness, color);
          g.addColorStop(0.86, hexToRgba(color, 0.42));
          g.addColorStop(1, hexToRgba(color, 0));
          c.fillStyle = g;
          c.fillRect(0, 0, size, size);
          return cv;
        }

        function hexToRgba(hex, a) {
          var v = parseInt(hex.slice(1), 16);
          return 'rgba(' + ((v >> 16) & 255) + ',' + ((v >> 8) & 255) + ',' + (v & 255) + ',' + a + ')';
        }

        function buildDiscs() {
          discsInk.length = 0;
          discsRed.length = 0;
          for (var i = 0; i < RADII.length; i++) {
            discsInk.push(buildDisc(RADII[i], act.ink, 0.5));
            discsRed.push(buildDisc(RADII[i], act.accent, 0.35));
          }
        }

        function discFor(radius, red) {
          var set = red ? discsRed : discsInk;
          for (var i = 0; i < RADII.length; i++) {
            if (RADII[i] >= radius) return set[i];
          }
          return set[set.length - 1];
        }

        /* ------------------------------------------------------ le monde */
        var chunks = new Map();
        // Les notes jouées restent jouées, même si le morceau de monde qui les
        // porte a été oublié puis reconstruit.
        var touched = new Set();
        var thread = []; // la partition qui se dessine, triée par x

        function noteKey(x, z) {
          return Math.round(x) + ':' + Math.round(z);
        }

        function rememberNote(n) {
          var key = noteKey(n.x, n.z);
          if (touched.has(key)) return;
          touched.add(key);
          // Insertion triée: le fil relie les notes dans l'ordre du terrain,
          // pas dans l'ordre où on les a trouvées.
          var i = thread.length;
          while (i > 0 && thread[i - 1].x > n.x) i--;
          thread.splice(i, 0, { x: n.x, y: n.y, z: n.z, kind: n.kind });
          if (thread.length > 400) thread.shift();
        }

        function groundAt(x) {
          return Math.sin(x * 0.0042) * 13 + Math.sin(x * 0.0011 + 2.1) * 27 + Math.sin(x * 0.019) * 2;
        }

        // grain = [x, y, z, taille monde, opacité]
        function grain(list, x, y, z, s, a) {
          list.push({ x: x, y: y, z: z, s: s, a: a });
        }

        function buildChunk(ci) {
          var r = makeRng(ci * 9176 + 1721);
          var x0 = ci * CHUNK;
          var back = [];
          var mid = [];
          var fore = [];
          var dust = [];
          var motes = [];
          var x, i, j, z, h;

          // Collines lointaines: la brume les éclaircit et les dissout.
          for (var layer = 0; layer < 4; layer++) {
            z = 210 + layer * 190 + r.range(-50, 50);
            var amp = 40 + layer * 26;
            var phase = r.range(0, 9);
            var step = 7 + layer * 3;
            for (x = x0 - 40; x < x0 + CHUNK + 40; x += step) {
              h = (Math.sin(x * 0.004 + phase) * 0.5 + 0.5) * amp + r.range(-4, 4);
              var stack = 1 + Math.floor(h / 26);
              for (j = 0; j < stack; j++) {
                grain(back, x, j * 9 + r.range(-2, 2), z + r.range(-14, 14), 6 + r.range(0, 5), 0.3 - layer * 0.05);
              }
            }
          }

          // Débris de l'arrière-plan proche.
          for (i = 0; i < 70; i++) {
            x = r.range(x0, x0 + CHUNK);
            z = r.range(45, 170);
            grain(mid, x, r.range(0, 26), z, r.range(2.5, 5), r.range(0.22, 0.46));
          }

          // Le sol n'est pas une ligne: c'est un champ qui s'enfonce. Les
          // cubes sont semés sur une grille (x, z) dont le pas grandit avec
          // la distance, pour garder une densité constante à l'écran. C'est
          // ce qui fait exister une surface plutôt qu'un décor découpé.
          for (z = -240; z < 360; ) {
            var k = F / (F + z);
            // Espacement constant à l'écran: dz doit croître en 1/k², sinon
            // les rangées lointaines s'empilent pour rien.
            var stepZ = Math.max(7, (2.3 * GRAIN * F) / (CAM_H * k * k));
            var stepX = Math.max(GRAIN, (GRAIN * 2.1) / k);
            var row = makeRng(ci * 7717 + Math.round(z + 400) * 131);
            for (x = x0; x < x0 + CHUNK; x += stepX) {
              if (row.next() > 0.74) continue; // trous: la matière respire
              var jx = row.range(-1.5, 1.5);
              var top = groundAt(x + z * 0.4) + row.range(-1.6, 2.6);
              var tone = 0.26 + row.range(-0.14, 0.24) - Math.max(0, z) * 0.0007;
              var cube = ((GRAIN - 1) / k) * 0.94;
              grain(mid, x + jx, top, z, cube, Math.max(0.05, tone));
              if (row.next() < 0.2) {
                grain(mid, x + jx, top + GRAIN / k, z, cube * 0.9, Math.max(0.07, tone + 0.12));
              }
            }
            z += stepZ;
          }

          // Éclats détachés, posés sur la surface.
          for (i = 0; i < 30; i++) {
            x = r.range(x0, x0 + CHUNK);
            z = r.range(-70, 140);
            grain(mid, x, groundAt(x + z * 0.4) + r.range(3, 16), z, r.range(2, 4.5), r.range(0.3, 0.6));
          }

          // Fibres verticales: herbes, poils, cils de poussière. Plantées
          // partout dans le champ, donc nettes seulement au bon plan.
          for (i = 0; i < 18; i++) {
            x = r.range(x0, x0 + CHUNK);
            z = r.range(-160, 300);
            var kf = F / (F + z);
            var len = r.int(4, 13);
            var lean = r.range(-0.7, 0.7);
            var base = groundAt(x + z * 0.4);
            for (j = 0; j < len; j++) {
              var t = j / len;
              grain(
                mid,
                x + (lean * j * (0.6 + t)) / kf,
                base + (j * (GRAIN - 0.8)) / kf,
                z,
                (GRAIN - 1.6) / kf,
                0.5 - t * 0.26
              );
            }
          }

          // Premier plan: une tige passée tout près de l'objectif. Elle ne
          // raconte rien, elle cadre — et c'est la signature de la macro.
          if (r.chance(0.45)) {
            var fx = r.range(x0, x0 + CHUNK);
            var fz = r.range(-400, -300);
            var fk = F / (F + fz);
            var lean = r.range(-0.55, 0.55);
            var baseScreen = r.range(1.5, 2.1); // en hauteurs d'objectif sous le sol net
            for (j = 0; j < 14; j++) {
              var fy = CAM_H * (1 - baseScreen / fk) + (j * 26) / fk;
              grain(fore, fx + lean * j * 22, fy, fz + r.range(-8, 8), r.range(22, 38), r.range(0.3, 0.55));
            }
          }

          // Poussière en suspension, à toutes les profondeurs.
          for (i = 0; i < 9; i++) {
            dust.push({
              x: r.range(x0, x0 + CHUNK),
              y: r.range(14, 190),
              z: r.range(-260, 260),
              s: r.range(1.6, 4),
              a: r.range(0.25, 0.6),
              ph: r.range(0, Math.PI * 2),
              sp: r.range(0.25, 0.8)
            });
          }

          // La curiosité. Rare, jamais deux dans le même morceau de monde.
          if (ci % 2 === 0) {
            var cx = r.range(x0 + 60, x0 + CHUNK - 60);
            motes.push({
              x: cx,
              y: groundAt(cx) + r.range(14, 46),
              z: r.range(-10, 22),
              ph: r.range(0, Math.PI * 2),
              found: 0,
              gone: 0
            });
          }

          // --- La partition ------------------------------------------------
          // Les notes sont des objets du monde, posés sur trois bandes de
          // profondeur. On n'en entend que celles dont on longe la bande:
          // changer de profondeur, c'est changer d'instrument.
          var notes = [];
          var nx = Math.ceil(x0 / NOTE_SPACING) * NOTE_SPACING;
          for (; nx < x0 + CHUNK; nx += actAt(nx).spacing * 1.5) {
            var rn = makeRng(Math.round(nx) * 977 + 13);
            if (rn.next() < 0.16) continue; // les silences font la phrase
            var contour = Math.sin(nx * 0.0035) * 2.4 + Math.sin(nx * 0.0013 + 1.1) * 1.9;
            // Moins de notes, mais chacune est un objet qu'on repère de loin:
            // on doit pouvoir viser une note, marcher dessus, et y revenir.
            var bands = [
              { z: rn.range(-76, -34), kind: 'bell', p: 0.3, oct: 1 },
              { z: rn.range(-12, 46), kind: 'pluck', p: 0.92, oct: 0 },
              { z: rn.range(96, 190), kind: 'bass', p: 0.34, oct: -1 }
            ];
            for (var bi = 0; bi < bands.length; bi++) {
              var band = bands[bi];
              if (rn.next() > band.p) continue;
              var nxx = nx + rn.range(-3, 3);
              notes.push({
                x: nxx,
                z: band.z,
                y: groundAt(nxx + band.z * 0.4) + 1,
                deg: Math.round(contour + rn.range(-0.6, 0.6)) + band.oct * 5,
                kind: band.kind,
                lit: 0,
                hop: 0,
                // Une note déjà jouée reste marquée: on sait qu'on est passé
                // par là, et qu'on peut y revenir.
                on: touched.has(noteKey(nxx, band.z))
              });
            }
          }

          // --- Les créatures -----------------------------------------------
          var creatures = [];
          // Rare: une rencontre par tableau environ. La surprise se garde.
          if (makeRng(ci * 131 + 7).int(0, 7) === 2) {
            var cr = makeRng(ci * 5501 + 77);
            var ccx = cr.range(x0 + 70, x0 + CHUNK - 70);
            // Les tiges de premier plan masquent tout: on s'en écarte.
            for (var fi = 0; fi < fore.length; fi += 14) {
              if (Math.abs(fore[fi].x - ccx) < 70) ccx += 110;
            }
            var ccz = cr.range(-34, 64);
            creatures.push({
              id: 'c' + ci,
              x: ccx,
              z: ccz,
              y: groundAt(ccx + ccz * 0.4),
              mood: cr.range(0.35, 0.6),
              ph: cr.range(0, 6.28),
              shape: cr.int(0, SPECIES.length),
              base: groundAt(ccx + ccz * 0.4),
              baseX: ccx,
              node: null,
              done: false
            });
          }

          // --- Les surprises -------------------------------------------------
          var events = [];
          var er = makeRng(ci * 3313 + 5);
          if (er.next() < 0.45) {
            var rx = er.range(x0 + 50, x0 + CHUNK - 50);
            var rz = er.range(-30, 90);
            events.push({
              kind: 'resonance',
              x: rx,
              z: rz,
              y: groundAt(rx + rz * 0.4),
              seed: er.int(0, 9999),
              fired: 0
            });
          }
          if (er.next() < 0.3) {
            events.push({
              kind: 'passage',
              x: er.range(x0, x0 + CHUNK),
              z: er.range(340, 620),
              y: er.range(30, 90),
              fired: 0,
              t: 0
            });
          }
          if (er.next() < 0.2) {
            events.push({
              kind: 'pluie',
              x: er.range(x0 + 60, x0 + CHUNK - 60),
              z: er.range(-20, 70),
              fired: 0,
              drops: []
            });
          }

          back.sort(byDepth);
          mid.sort(byDepth);
          fore.sort(byDepth);
          return { back: back, mid: mid, fore: fore, dust: dust, motes: motes, notes: notes, creatures: creatures, events: events };
        }

        function byDepth(a, b) {
          return b.z - a.z;
        }

        function chunkAt(ci) {
          var c = chunks.get(ci);
          if (!c) {
            c = buildChunk(ci);
            chunks.set(ci, c);
          }
          return c;
        }

        /* --------------------------------------------------------- état */
        var cam = { x: 0, z: 0, drift: 0 };
        var CAM_TOP = 560; // hauteur de l'objectif en vue de dessus
        var camMode = 0; // 0 latérale · 1 dessus · 2 face
        var CAM_NAMES = ['latérale', 'dessus', 'face'];
        var hero = { x: 0, z: 0, vx: 0, vz: 0, face: 1, step: 0, bob: 0, prevX: 0 };
        var steps = 0;
        var fragments = []; // les morceaux de phrase donnés par les créatures
        var nearCreature = null;
        var focusZ = 0;
        var focusTarget = 0;
        var focusHold = 0; // secondes pendant lesquelles une curiosité garde le point
        var time = 0;
        var held = null; // point visé par le doigt / la souris, en pixels canvas
        var keys = Object.create(null);
        var interacted = false;

        /* ------------------------------------------------------ l'objectif
         * Une seule fonction place un point du monde à l'écran, quelle que
         * soit la vue. Elle rend aussi `blur`: la distance au plan de
         * netteté, mesurée le long de l'axe de la caméra — c'est elle qui
         * décide si un grain est un carré net ou un disque étalé.
         *
         * La caméra suit la créature en profondeur (`cam.z`): s'enfoncer
         * rapproche tout le fond au lieu de simplement le rétrécir, et c'est
         * ça qui donne la sensation d'un objectif qui avance dans la matière.
         */
        function mapPoint(gx, gy, gz) {
          var depth, k, sx, sy, blur;

          if (camMode === 2) {
            // Vue de face: on regarde le long de la marche. L'axe x devient
            // la profondeur, l'axe z l'horizontale.
            depth = gx - cam.x + 300;
            if (F + depth < 70) return null;
            k = F / (F + depth);
            sx = W * 0.5 - (gz - cam.z + cam.drift) * k * unit;
            sy = horizonY + (CAM_H - gy) * k * unit;
            blur = gx - hero.x;
            return { k: k, sx: sx, sy: sy, blur: blur };
          }

          depth = gz - cam.z;
          if (camMode === 1) {
            // Vue de dessus: la profondeur s'étale verticalement et l'échelle
            // ne dépend plus que de la hauteur des choses.
            var kt = F / (F + Math.max(30, CAM_TOP - gy));
            sx = W * 0.5 + (gx - cam.x + cam.drift) * kt * unit * 1.6;
            sy = H * 0.52 + (gz - cam.z) * kt * unit * 1.6;
            return { k: kt * 1.6, sx: sx, sy: sy, blur: gz - focusZ };
          }

          if (F + depth < 70) return null;
          k = F / (F + depth);
          sx = W * 0.5 + (gx - cam.x + cam.drift) * k * unit;
          sy = horizonY + (CAM_H - gy) * k * unit;
          return { k: k, sx: sx, sy: sy, blur: gz - focusZ };
        }

        function project(gx, gy, gz) {
          return mapPoint(gx, gy, gz) || { k: 0.001, sx: -9999, sy: -9999, blur: 0 };
        }

        var BUCKETS = 10;
        var inkStyles = [];
        var queues = [];
        (function () {
          for (var i = 0; i < BUCKETS; i++) {
            inkStyles.push('');
            queues.push([]);
          }
        })();

        function restyleInk() {
          var v = parseInt(act.ink.slice(1), 16);
          var rgb = ((v >> 16) & 255) + ',' + ((v >> 8) & 255) + ',' + (v & 255);
          for (var i = 0; i < BUCKETS; i++) {
            inkStyles[i] = 'rgba(' + rgb + ',' + ((i + 1) / BUCKETS).toFixed(2) + ')';
          }
        }

        function flushCrisp() {
          for (var b = 0; b < BUCKETS; b++) {
            var q = queues[b];
            if (q.length === 0) continue;
            ctx.globalAlpha = 1;
            ctx.fillStyle = inkStyles[b];
            for (var i = 0; i < q.length; i += 3) ctx.fillRect(q[i], q[i + 1], q[i + 2], q[i + 2]);
            q.length = 0;
          }
        }

        function drawGrain(g, redTint, alphaBoost) {
          var pt = mapPoint(g.x, g.y, g.z);
          if (!pt || pt.k <= 0.03) return;
          var k = pt.k;
          var sx = pt.sx;
          if (sx < -80 || sx > W + 80) return;
          var sy = pt.sy;
          if (sy < -120 || sy > H + 120) return;
          var size = g.s * k * unit;
          var coc = Math.abs(pt.blur) * k * APERTURE * unit;
          var alpha = g.a * (alphaBoost || 1);

          if (coc < 1.1) {
            var ps = Math.max(1, Math.round(size));
            if (redTint) {
              ctx.globalAlpha = Math.min(1, alpha);
              ctx.fillStyle = act.accent;
              ctx.fillRect(Math.round(sx), Math.round(sy), ps, ps);
            } else {
              var b = Math.min(BUCKETS - 1, Math.max(0, Math.round(alpha * BUCKETS) - 1));
              var q = queues[b];
              q.push(Math.round(sx), Math.round(sy), ps);
            }
            return;
          }
          // Hors netteté: la matière s'étale et perd d'autant en densité.
          var radius = Math.min(72, size * 0.5 + coc);
          var spread = (size * size) / (radius * radius * 3.1);
          var out = Math.min(1, alpha * Math.max(0.05, spread * 2.4));
          if (out < 0.015) return; // invisible: ne pas payer le dessin
          ctx.globalAlpha = out;
          var sprite = discFor(radius, redTint);
          var d = radius * 2;
          ctx.drawImage(sprite, sx - radius, sy - radius, d, d);
        }

        /* ------------------------------------------------- la créature */
        // Trois grains de large: assez pour une silhouette, pas assez pour
        // un personnage. C'est l'échelle qui raconte, pas le dessin.
        var GAIT = [
          ['.#.', '###', '#.#'],
          ['.#.', '###', '.##'],
          ['.#.', '###', '#.#'],
          ['.#.', '###', '##.']
        ];

        function heroGround() {
          return groundAt(hero.x + hero.z * 0.4);
        }

        function drawHero() {
          var moving = Math.abs(hero.vx) + Math.abs(hero.vz) > 5;
          var frame = moving ? GAIT[Math.floor(hero.step) % GAIT.length] : GAIT[0];
          var ground = heroGround();
          var baseY = ground + GRAIN * 3 + hero.bob; // 3 grains de haut
          var p = project(hero.x, baseY, hero.z);
          var groundPt = project(hero.x, ground, hero.z);
          var cell = GRAIN * unit * p.k;

          // Ombre portée: un disque doux, posé au sol.
          ctx.globalAlpha = 0.3;
          ctx.drawImage(
            discFor(9, false),
            p.sx - cell * 2.6,
            groundPt.sy - cell * 0.9,
            cell * 5.2,
            cell * 1.9
          );

          ctx.globalAlpha = 1;
          ctx.fillStyle = act.ink;
          var side = Math.max(2, Math.round(cell * 0.84));
          for (var row = 0; row < frame.length; row++) {
            for (var col = 0; col < 3; col++) {
              if (frame[row][col] !== '#') continue;
              var gx = Math.round(p.sx + (col - 1) * cell * hero.face - side / 2);
              var gy = Math.round(p.sy + row * cell);
              ctx.fillRect(gx, gy, side, side);
            }
          }
        }

        /* --------------------------------------------------- la curiosité
         * Le rouge n'annonce pas un danger: il appelle. Il pulse doucement,
         * s'ouvre quand on s'approche, puis s'élève et s'en va.
         */
        function updateMote(m, dt) {
          m.ph += dt * 0.9;
          var d = Math.abs(m.x - hero.x);
          if (!m.found && d < 46) {
            m.found = 1;
            focusTarget = m.z;
            focusHold = 2.4;
            Sound.note('bell', 7, 0.2);
            Sound.note('bell', 12, 0.16, 0.18);
          }
          if (m.found) {
            m.found += dt * 0.55;
            if (m.found > 2.2 && !m.gone) {
              m.gone = 1;
            }
          }
          if (m.gone) {
            m.gone += dt * 0.5;
            m.y += dt * 16;
            m.x += dt * 5;
            if (m.gone > 2.4) focusHold = 0;
          }
          if (m.found && m.found < 2.2) {
            focusTarget = m.z;
            focusHold = Math.max(focusHold, 0.3);
          }
        }

        function drawMote(m) {
          if (m.gone > 2.6) return;
          var mp = mapPoint(m.x, m.y, m.z);
          if (!mp) return;
          var k = mp.k;
          var sx = mp.sx;
          if (sx < -90 || sx > W + 90) return;
          var sy = mp.sy;
          var pulse = 0.5 + 0.5 * Math.sin(m.ph);
          var bloom = m.found ? Math.min(1, m.found) : 0;
          var fade = m.gone ? Math.max(0, 1 - (m.gone - 1) / 1.6) : 1;
          var coc = Math.abs(mp.blur) * k * APERTURE * unit;

          // Halo: la seule lumière colorée de la scène.
          ctx.globalAlpha = (0.1 + pulse * 0.1 + bloom * 0.3) * fade;
          var halo = (12 + pulse * 5 + bloom * 26 + coc * 2) * k * unit;
          ctx.drawImage(discFor(halo, true), sx - halo, sy - halo, halo * 2, halo * 2);

          // Le grain lui-même, net s'il est dans le plan.
          drawGrain({ x: m.x, y: m.y, z: m.z, s: GRAIN - 1 + bloom * 1.5, a: fade }, true, 1);

          // Éclats qui s'échappent quand elle s'ouvre.
          if (bloom > 0.15) {
            for (var i = 0; i < 5; i++) {
              var a = m.ph * 0.6 + (i / 5) * Math.PI * 2;
              var rr = (10 + bloom * 26) * k;
              ctx.globalAlpha = 0.5 * bloom * fade;
              ctx.fillStyle = act.accent;
              ctx.fillRect(Math.round(sx + Math.cos(a) * rr), Math.round(sy + Math.sin(a) * rr * 0.7), 2, 2);
            }
          }
        }

        /* ------------------------------------------------------- rendu */
        var noiseTile = null;
        var bgLayer = null;
        var vigLayer = null;
        var noiseLayer = null;

        function buildStatics() {
          bgLayer = document.createElement('canvas');
          bgLayer.width = W;
          bgLayer.height = H;
          var bc = bgLayer.getContext('2d');
          var g = bc.createLinearGradient(0, 0, 0, H);
          g.addColorStop(0, act.paper[0]);
          g.addColorStop(0.55, mixHex(act.paper[0], act.paper[1], 0.55));
          g.addColorStop(1, act.paper[1]);
          bc.fillStyle = g;
          bc.fillRect(0, 0, W, H);

          vigLayer = document.createElement('canvas');
          vigLayer.width = W;
          vigLayer.height = H;
          var vc = vigLayer.getContext('2d');
          var v = vc.createRadialGradient(W / 2, H * 0.5, Math.min(W, H) * 0.32, W / 2, H * 0.5, Math.max(W, H) * 0.78);
          v.addColorStop(0, 'rgba(0,0,0,0)');
          v.addColorStop(1, act.dark ? 'rgba(0,0,0,0.55)' : 'rgba(20,20,22,0.3)');
          vc.fillStyle = v;
          vc.fillRect(0, 0, W, H);

          if (noiseTile) {
            noiseLayer = document.createElement('canvas');
            noiseLayer.width = W + 130;
            noiseLayer.height = H + 130;
            var nc = noiseLayer.getContext('2d');
            nc.fillStyle = nc.createPattern(noiseTile, 'repeat');
            nc.fillRect(0, 0, noiseLayer.width, noiseLayer.height);
          }
        }

        function buildNoise() {
          var n = 128;
          var cv = document.createElement('canvas');
          cv.width = n;
          cv.height = n;
          var c = cv.getContext('2d');
          var img = c.createImageData(n, n);
          for (var i = 0; i < img.data.length; i += 4) {
            var v = 128 + (Math.random() * 2 - 1) * 60;
            img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
            img.data[i + 3] = 26;
          }
          c.putImageData(img, 0, 0);
          noiseTile = cv;
        }

        function backdrop() {
          ctx.globalAlpha = 1;
          if (bgLayer) ctx.drawImage(bgLayer, 0, 0);

          // Lueur rouge très lointaine: une promesse, hors de portée.
          var glowX = W * 0.5 + (2400 - cam.x) * (F / (F + 900));
          if (glowX > -160 && glowX < W + 160) {
            ctx.globalAlpha = 0.22;
            ctx.drawImage(discFor(56, true), glowX - 70, horizonY - 28, 140, 140);
          }
        }

        function postProcess() {
          ctx.globalAlpha = 1;
          // Grain argentique: la même nappe, décalée à chaque image.
          if (noiseLayer) {
            var ox = reduceMotion ? 0 : Math.floor(Math.random() * 128);
            var oy = reduceMotion ? 0 : Math.floor(Math.random() * 128);
            ctx.drawImage(noiseLayer, -ox, -oy);
          }
          // Vignette: l'objectif n'éclaire pas jusqu'aux bords.
          if (vigLayer) ctx.drawImage(vigLayer, 0, 0);
        }

        function visibleChunks() {
          var span = (W * 0.5 + 420) / 1;
          var from = Math.floor((cam.x - span) / CHUNK);
          var to = Math.floor((cam.x + span) / CHUNK);
          var out = [];
          for (var i = from - 1; i <= to + 1; i++) out.push(chunkAt(i));
          return out;
        }

        function render(dt) {
          backdrop();
          var list = visibleChunks();
          drawPassages(list);
          var i, j, c;

          for (i = 0; i < list.length; i++) {
            c = list[i];
            for (j = 0; j < c.back.length; j++) drawGrain(c.back[j], false, 1);
          }
          flushCrisp();
          for (i = 0; i < list.length; i++) {
            c = list[i];
            for (j = 0; j < c.mid.length; j++) drawGrain(c.mid[j], false, 1);
          }
          flushCrisp();

          // Poussière: elle dérive, elle respire.
          for (i = 0; i < list.length; i++) {
            c = list[i];
            for (j = 0; j < c.dust.length; j++) {
              var d = c.dust[j];
              d.ph += dt * d.sp;
              drawGrain(
                { x: d.x + Math.sin(d.ph) * 9, y: d.y + Math.cos(d.ph * 0.7) * 6, z: d.z, s: d.s, a: d.a },
                false,
                1
              );
            }
          }

          flushCrisp();
          drawWeather();
          drawThread();
          drawNotes(list);
          drawEvents(list);
          flushCrisp();
          drawCreatures(list);
          drawHero();

          for (i = 0; i < list.length; i++) {
            c = list[i];
            for (j = 0; j < c.motes.length; j++) {
              updateMote(c.motes[j], dt);
              drawMote(c.motes[j]);
            }
          }

          // Le premier plan passe devant tout le reste.
          for (i = 0; i < list.length; i++) {
            c = list[i];
            for (j = 0; j < c.fore.length; j++) drawGrain(c.fore[j], false, 1);
          }

          flushCrisp();
          postProcess();
          drawFlash();
        }

        /* ------------------------------------------------------ logique */
        function update(dt) {
          time += dt;
          hero.prevX = hero.x;

          var dirX = 0;
          var dirZ = 0;
          if (keys['ArrowLeft'] || keys['KeyA'] || keys['KeyQ']) dirX -= 1;
          if (keys['ArrowRight'] || keys['KeyD']) dirX += 1;
          if (keys['ArrowUp'] || keys['KeyW'] || keys['KeyZ']) dirZ += 1; // s'enfoncer
          if (keys['ArrowDown'] || keys['KeyS']) dirZ -= 1; // revenir vers l'objectif
          if (held && !talkOpen) {
            // On marche vers le doigt: horizontalement, et en profondeur selon
            // qu'il est au-dessus ou au-dessous de la créature.
            var hp = project(hero.x, heroGround() + GRAIN * 2, hero.z);
            var dx = held.x - hp.sx;
            var dy = held.y - hp.sy;
            if (Math.abs(dx) > 14) dirX = dx > 0 ? 1 : -1;
            if (Math.abs(dy) > 26) dirZ = dy < 0 ? 1 : -1;
          }
          if (talkOpen) {
            dirX = 0;
            dirZ = 0;
          }

          var speed = 52;
          hero.vx += (dirX * speed - hero.vx) * Math.min(1, dt * 9);
          hero.vz += (dirZ * speed * 0.62 - hero.vz) * Math.min(1, dt * 7);
          hero.x += hero.vx * dt;
          hero.z = Math.max(-80, Math.min(230, hero.z + hero.vz * dt));
          if (Math.abs(hero.vx) + Math.abs(hero.vz) > 5) {
            if (Math.abs(hero.vx) > 4) hero.face = hero.vx > 0 ? 1 : -1;
            hero.step += dt * 9;
            hero.bob = Math.sin(hero.step * Math.PI) > 0 ? 0 : 1;
          } else {
            hero.bob = Math.sin(time * 1.6) > 0.7 ? 1 : 0;
          }

          readScore();
          updateAsk(dt);
          updateRegion();
          Sound.setDepth(hero.z);

          cam.x += (hero.x - cam.x) * Math.min(1, dt * 2.4);
          // L'objectif accompagne la créature dans la profondeur: c'est ce
          // déplacement, et pas seulement le changement d'échelle, qui fait
          // sentir qu'on entre dans la matière.
          cam.z += (hero.z - cam.z) * Math.min(1, dt * 1.7);
          // Respiration de l'opérateur: infime, mais c'est elle qui fait
          // croire à une caméra tenue au-dessus d'une maquette.
          cam.drift = reduceMotion ? 0 : Math.sin(time * 0.53) * 2.4 + Math.sin(time * 1.31) * 0.9;

          // La netteté suit la créature: c'est elle qui définit le plan, et
          // s'enfoncer déplace donc tout le point de l'image.
          if (talk && talk.creature) {
            // Conversation: l'objectif fait le point sur elle, pas sur nous.
            focusTarget = talk.creature.z;
          } else if (!focusHold) {
            focusTarget = hero.z;
          }
          focusHold = Math.max(0, focusHold - dt);
          var breathe = reduceMotion ? 0 : Math.sin(time * 0.31) * 3.5;
          focusZ += (focusTarget + breathe - focusZ) * Math.min(1, dt * 2.2);

          // On ne garde que le monde proche en mémoire.
          if (chunks.size > 14) {
            var keep = Math.floor(cam.x / CHUNK);
            chunks.forEach(function (_, key) {
              if (Math.abs(key - keep) > 5) chunks.delete(key);
            });
          }
        }

        /* ------------------------------------------------------- l'histoire
         * Elle ne s'écrit pas dans des cinématiques: elle se donne par
         * morceaux, par des créatures qui demandent quelque chose avant de
         * parler. Chaque morceau recueilli est un fragment de la phrase dont
         * on s'est échappé.
         */
        var TALKS = [

              },

                ]
              },
              peur: {

                ask: { type: 'caress', label: 'caressez-la' },
                to: 'gift'
              },
              passe: {

                ask: { type: 'caress', label: 'caressez-la' },

              },
