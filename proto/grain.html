        // Les voix: j'ai lu « plus de voix » comme « davantage ». Si c'était
        // l'inverse, c'est cette ligne qu'il faut passer à false.
        var VOICES = true;

        var talkOpen = false;
        var talk = null; // { creature, script, node }
        var pendingAsk = null; // { type, progress, done }

        function openTalk(creature) {
          if (talkOpen || creature.done) return;
          Sound.unlock();
          markInteracted();
          talk = { creature: creature, script: TALKS[creature.shape % TALKS.length], node: 'start' };
          talkOpen = true;
          held = null;
          hud.talk.classList.add('open');
          renderTalk();
        }

        function closeTalk() {
          talkOpen = false;
          talk = null;
          hud.talk.classList.remove('open');
        }

        function renderTalk() {
          var node = talk.script.nodes[talk.node];
          hud.who.textContent = talk.script.who;
          hud.line.textContent = node.line;
          // La voix: des impulsions filtrées, très douces, jamais des mots.
          var spec = SPECIES[(talk.creature.shape || 0) % SPECIES.length];
          if (VOICES) Sound.voice(
            talk.node.charCodeAt(0) * 31 + node.line.length,
            Math.min(18, Math.round(node.line.length / 5)),
            spec.voice
          );

          hud.choices.innerHTML = '';

          if (node.gift) {
            // Le don: un motif qui devient une trace dans la phrase.
            addChoice('Prendre', function () {
              fragments.push(node.gift);
              paintPhrase();
              Sound.motif(node.gift.motif, 'bell', 0.17);
              talk.creature.done = true;
              talk.creature.mood = 0.15;
              closeTalk();
              // Trois morceaux: la phrase se referme, et le monde le dit.
              if (fragments.length === 3) {
                setTimeout(function () {
                  var whole = [];
                  for (var i = 0; i < 3; i++) whole = whole.concat(fragments[i].motif);
                  Sound.motif(whole, 'pluck', 0.2);
                  announce('la phrase');
                }, 900);
              }
            });
            return;
          }
          if (node.ask) {
            addChoice('…', function () {
              var target = node.to;
              startAsk(node.ask, function () {
                talk.node = target;
                talkOpen = true;
                hud.talk.classList.add('open');
                renderTalk();
              });
            });
            return;
          }
          for (var i = 0; i < node.choices.length; i++) {
            (function (choice) {
              addChoice(choice.text, function () {
                talk.node = choice.to;
                Sound.digital(true);
                renderTalk();
              });
            })(node.choices[i]);
          }
        }

        function addChoice(label, fn) {
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = label;
          b.addEventListener('click', fn);
          hud.choices.appendChild(b);
        }

        /* ----------------------------------------------- gestes demandés
         * Caresser, secouer, pencher. Sur un ordinateur, le frottement de la
         * souris remplace les capteurs: la demande reste testable partout.
         */
        function startAsk(ask, done) {
          hud.talk.classList.remove('open');
          talkOpen = false;
          pendingAsk = { type: ask.type, progress: 0, done: done };
          var needsSensor = ask.type === 'shake' || ask.type === 'tilt';
          hud.askLabel.textContent = ask.label + (needsSensor ? ' — ou frottez l\'écran' : '');
          hud.ask.classList.add('show');
          hud.askBar.style.width = '0%';
          if (needsSensor) requestSensors();
        }

        // Rester immobile, ou repasser à l'envers: deux demandes qui n'ont
        // besoin d'aucun capteur et qui changent la façon de marcher.
        function updateAsk(dt) {
          if (!pendingAsk) return;
          if (pendingAsk.type === 'immobile') {
            if (Math.abs(hero.vx) + Math.abs(hero.vz) < 4) feedAsk(dt * 0.42);
            else pendingAsk.progress = Math.max(0, pendingAsk.progress - dt * 0.8);
          } else if (pendingAsk.type === 'reverse') {
            if (hero.vx < -14) feedAsk(dt * 0.5);
          }
        }

        function feedAsk(amount) {
          if (!pendingAsk) return;
          pendingAsk.progress = Math.min(1, pendingAsk.progress + amount);
          hud.askBar.style.width = Math.round(pendingAsk.progress * 100) + '%';
          if (talk && talk.creature) {
            talk.creature.mood = Math.min(1, talk.creature.mood + amount * (pendingAsk.type === 'caress' ? -0.6 : 0.8));
            if (pendingAsk.type === 'caress') talk.creature.mood = Math.max(0.05, talk.creature.mood);
          }
          if (Math.random() < amount * 6) Sound.note('bell', Math.floor(Math.random() * 5), 0.05);
          if (pendingAsk.progress >= 1) {
            var done = pendingAsk.done;
            pendingAsk = null;
            hud.ask.classList.remove('show');
            Sound.note('bell', 7, 0.16);
            setTimeout(done, 350);
          }
        }

        var sensorsAsked = false;
        function requestSensors() {
          if (sensorsAsked) return;
          sensorsAsked = true;
          var wire = function () {
            window.addEventListener('devicemotion', onMotion);
            window.addEventListener('deviceorientation', onTilt);
          };
          try {
            if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
              DeviceMotionEvent.requestPermission().then(function (r) {
                if (r === 'granted') wire();
              })['catch'](function () {});
              if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()['catch'](function () {});
              }
            } else {
              wire();
            }
          } catch (e) {
            /* capteurs indisponibles: le frottement suffit */
          }
        }

        var lastShake = 0;
        function onMotion(e) {
          if (!pendingAsk || pendingAsk.type !== 'shake') return;
          var a = e.accelerationIncludingGravity;
          if (!a) return;
          var mag = Math.abs(a.x || 0) + Math.abs(a.y || 0) + Math.abs(a.z || 0);
          var d = Math.abs(mag - lastShake);
          lastShake = mag;
          if (d > 3) feedAsk(Math.min(0.09, d * 0.012));
        }

        function onTilt(e) {
          if (!pendingAsk || pendingAsk.type !== 'tilt') return;
          var g = Math.abs(e.gamma || 0);
          if (g > 22) feedAsk(0.014);
        }

        function paintPhrase() {
          hud.phrase.innerHTML = '';
          for (var i = 0; i < 3; i++) {
            var t = document.createElement('span');
            t.className = 'tick' + (i < fragments.length ? ' on' : '');
            hud.phrase.appendChild(t);
          }
        }

        /* --------------------------------------------- lecture de la partition
         * La créature est la tête de lecture. On regarde simplement quelles
         * notes ont été traversées depuis la dernière image: vers la droite
         * elles arrivent dans l'ordre, vers la gauche dans l'autre — la
         * mélodie à l'envers sort toute seule de la géométrie.
         */
        function readScore() {
          var a = hero.prevX;
          var b = hero.x;
          if (a === b) return;
          var lo = Math.min(a, b);
          var hi = Math.max(a, b);
          var list = visibleChunks();
          for (var i = 0; i < list.length; i++) {
            var ns = list[i].notes;
            for (var j = 0; j < ns.length; j++) {
              var n = ns[j];
              if (n.x < lo || n.x > hi) continue;
              var dz = Math.abs(hero.z - n.z);
              if (dz > 58) continue; // on ne joue que la bande qu'on longe
              var vel = 0.035 + 0.1 * (1 - dz / 58);
              Sound.note(n.kind, n.deg, vel);
              Sound.blip(n.kind === 'bass' ? 0.5 : 1); // le petit bruit d'attache
              n.lit = 1;
              n.hop = 1;
              n.on = true;
              rememberNote(n);
              pings.push({ x: n.x, y: n.y, z: n.z, r: 0, life: 1 });
              steps++;
            }
            var evs = list[i].events;
            for (var e = 0; e < evs.length; e++) fireEvent(evs[e], lo, hi);
          }
        }

        function updateRegion() {
          var i = actIndexAt(hero.x);
          if (i === actIndex && act === ACTS[i]) return;
          applyAct(i, true);
        }

        function applyAct(i, announceIt) {
          actIndex = i;
          act = ACTS[i];
          restyleInk();
          buildDiscs();
          buildStatics();
          var root = document.documentElement.style;
          root.setProperty('--paper', act.paper[0]);
          root.setProperty('--ink', act.ink);
          root.setProperty('--accent', act.accent);
          root.setProperty('--dim', mixHex(act.ink, act.paper[0], 0.55));
          root.setProperty('--line', mixHex(act.ink, act.paper[0], 0.76));
          Sound.setScale(act.scale);
          Sound.setTonic(act.tonic);
          Sound.setWet(act.wet);
          setWeather(act.weather);
          if (announceIt) {
            announce(act.word);
            // Les morceaux de phrase déjà recueillis se rappellent à nous.
            if (fragments.length) Sound.motif(fragments[fragments.length - 1].motif, 'bell', 0.16);
          }
        }

        function mixHex(a, b, t) {
          var va = parseInt(a.slice(1), 16);
          var vb = parseInt(b.slice(1), 16);
          var r = Math.round(((va >> 16) & 255) * (1 - t) + ((vb >> 16) & 255) * t);
          var g = Math.round(((va >> 8) & 255) * (1 - t) + ((vb >> 8) & 255) * t);
          var bl = Math.round((va & 255) * (1 - t) + (vb & 255) * t);
          return '#' + ((r << 16) | (g << 8) | bl).toString(16).padStart(6, '0');
        }

        function announce(text) {
          hud.region.textContent = text;
          hud.region.classList.add('show');
          clearTimeout(announce._t);
          announce._t = setTimeout(function () {
            hud.region.classList.remove('show');
          }, 2600);
        }

        /* --------------------------------------------------------- la météo
         * La pluie est faite des mêmes grains que le reste. Chaque goutte qui
         * touche le sol ouvre une onde — un anneau de grains qui s'écarte —
         * et fait sonner une note très basse en niveau. Il pleut donc de la
         * musique, en continu, sans jamais rien déclencher d'autre.
         */
        var pings = []; // l'onde qui s'ouvre sous une note qu'on vient d'activer

        var weather = {
          kind: 'clair',
          drops: [],
          ripples: [],
          flash: 0,
          pulses: [],
          bolt: 7,
          wind: 0,
          rng: makeRng(4242)
        };

        function setWeather(kind) {
          weather.kind = kind;
          weather.drops.length = 0;
          weather.ripples.length = 0;
          weather.flash = 0;
          weather.pulses.length = 0;
          weather.bolt = 4 + Math.random() * 6;
          weather.wind = kind === 'orage' ? -26 : kind === 'vent' ? -14 : 0;
        }

        /* Un éclair n'est pas un fondu: c'est une salve. Trois à six
         * impulsions inégales, le craquement tout de suite, le grondement qui
         * arrive après — d'autant plus tard qu'il tombe loin. */
        function strike() {
          var far = 0.2 + Math.random() * 1.4;
          Sound.crack();
          Sound.thunder(far);
          if (reduceMotion) {
            weather.pulses.push({ in: 0, power: 0.5 });
            return;
          }
          var n = 3 + Math.floor(Math.random() * 4);
          var t = 0;
          for (var i = 0; i < n; i++) {
            t += 0.035 + Math.random() * 0.12;
            weather.pulses.push({ in: t, power: i === 0 ? 1 : 0.4 + Math.random() * 0.6 });
          }
        }

        function dropCount() {
          if (weather.kind === 'orage') return 74;
          if (weather.kind === 'pluie') return 40;
          return 0;
        }

        function updateWeather(dt) {
          var want = dropCount();
          var r = weather.rng;

          while (weather.drops.length < want) {
            weather.drops.push({
              x: hero.x + r.range(-320, 320),
              y: r.range(120, 420),
              z: r.range(-140, 300),
              v: 150 + r.range(0, 120),
              len: r.range(2.5, 5)
            });
          }
          if (weather.drops.length > want) weather.drops.length = want;

          for (var i = 0; i < weather.drops.length; i++) {
            var d = weather.drops[i];
            d.y -= d.v * dt;
            d.x += weather.wind * dt;
            var ground = groundAt(d.x + d.z * 0.4);
            if (d.y <= ground) {
              // L'impact: une onde, et une note très douce.
              weather.ripples.push({ x: d.x, y: ground, z: d.z, r: 0, life: 1 });
              if (Math.abs(d.z - hero.z) < 120 && r.next() < 0.22) {
                Sound.note(r.next() < 0.3 ? 'pluck' : 'bell', r.int(0, 6), 0.022);
              }
              d.y = 140 + r.range(0, 300);
              d.x = hero.x + r.range(-320, 320);
              d.z = r.range(-140, 300);
            }
          }

          for (var j = weather.ripples.length - 1; j >= 0; j--) {
            var rp = weather.ripples[j];
            rp.r += dt * 36;
            rp.life -= dt * 0.9;
            if (rp.life <= 0) weather.ripples.splice(j, 1);
          }
          if (weather.ripples.length > 60) weather.ripples.splice(0, weather.ripples.length - 60);

          if (weather.kind === 'orage') {
            weather.bolt -= dt;
            if (weather.bolt <= 0) {
              weather.bolt = 7 + Math.random() * 12;
              strike();
            }
          }
          // Les impulsions de l'éclair: brèves, inégales, franches.
          for (var b = weather.pulses.length - 1; b >= 0; b--) {
            weather.pulses[b].in -= dt;
            if (weather.pulses[b].in <= 0) {
              weather.flash = Math.max(weather.flash, weather.pulses[b].power);
              weather.pulses.splice(b, 1);
            }
          }
          weather.flash = Math.max(0, weather.flash - dt * (reduceMotion ? 3 : 11));
        }

        function drawWeather() {
          var i;
          for (i = 0; i < weather.drops.length; i++) {
            var d = weather.drops[i];
            // Une goutte est un trait de deux ou trois grains: elle tombe
            // dans le même volume que tout le reste, donc elle se floute.
            for (var q = 0; q < 3; q++) {
              drawGrain(
                { x: d.x - q * weather.wind * 0.012, y: d.y + q * d.len, z: d.z, s: GRAIN - 2.6, a: 0.42 - q * 0.1 },
                false,
                1
              );
            }
          }
          for (i = 0; i < weather.ripples.length; i++) {
            var rp = weather.ripples[i];
            var pts = 12;
            for (var a = 0; a < pts; a++) {
              var ang = (a / pts) * Math.PI * 2;
              drawGrain(
                {
                  x: rp.x + Math.cos(ang) * rp.r,
                  y: rp.y + 0.5,
                  z: rp.z + Math.sin(ang) * rp.r * 0.55,
                  s: GRAIN - 3,
                  a: Math.max(0, rp.life * 0.5)
                },
                false,
                1
              );
            }
          }
        }

        function drawFlash() {
          if (weather.flash <= 0.01) return;
          // L'éclair éclaire vraiment: la nuit devient blanche une fraction de
          // seconde, et l'image se retrouve en négatif de ce qu'elle était.
          ctx.globalAlpha = Math.min(1, weather.flash * 0.92);
          ctx.fillStyle = act.dark ? '#dfe7f2' : '#ffffff';
          ctx.fillRect(0, 0, W, H);
          ctx.globalAlpha = 1;
        }

        /* ------------------------------------------------------ surprises
         * Trois phénomènes, chacun avec sa couleur sonore: un bouquet qui
         * résonne au passage, une masse immense qui traverse le fond, une
         * pluie de curiosités qui sonne en touchant le sol.
         */
        function fireEvent(ev, lo, hi) {
          if (ev.fired) return;
          if (ev.kind === 'resonance') {
            if (ev.x < lo || ev.x > hi || Math.abs(hero.z - ev.z) > 85) return;
            ev.fired = 1.6;
            var rr = makeRng(ev.seed);
            for (var i = 0; i < 6; i++) Sound.note('bell', rr.int(0, 8), 0.11, i * 0.085);
          } else if (ev.kind === 'pluie') {
            if (ev.x < lo || ev.x > hi) return;
            ev.fired = 1;
            for (var d = 0; d < 15; d++) {
              ev.drops.push({
                x: ev.x + (Math.random() * 170 - 85),
                y: 150 + Math.random() * 140,
                z: ev.z + (Math.random() * 70 - 35),
                v: 16 + Math.random() * 30,
                landed: 0
              });
            }
          }
        }

        function updateEvents(dt) {
          var list = visibleChunks();
          for (var i = 0; i < list.length; i++) {
            var evs = list[i].events;
            for (var e = 0; e < evs.length; e++) {
              var ev = evs[e];
              if (ev.kind === 'passage') {
                if (!ev.fired && Math.abs(hero.x - ev.x) < 300) {
                  ev.fired = 1;
                  Sound.note('bass', -5, 0.2);
                  Sound.note('bass', -12, 0.16, 0.5);
                }
                if (ev.fired) ev.t += dt;
              } else if (ev.kind === 'resonance') {
                if (ev.fired > 0) ev.fired = Math.max(0, ev.fired - dt);
              } else if (ev.kind === 'pluie') {
                for (var d = 0; d < ev.drops.length; d++) {
                  var dr = ev.drops[d];
                  if (dr.landed) {
                    dr.landed += dt;
                    continue;
                  }
                  dr.y -= dr.v * dt;
                  if (dr.y <= groundAt(dr.x + dr.z * 0.4)) {
                    dr.y = groundAt(dr.x + dr.z * 0.4);
                    dr.landed = 0.001;
                    Sound.note('bell', Math.floor(Math.random() * 5) + 5, 0.07);
                  }
                }
              }
            }
          }
        }

        function drawPassages(list) {
          for (var i = 0; i < list.length; i++) {
            var evs = list[i].events;
            for (var e = 0; e < evs.length; e++) {
              var ev = evs[e];
              if (ev.kind !== 'passage' || !ev.fired || ev.t > 11) continue;
              var travel = -260 + ev.t * 58;
              var pp = mapPoint(ev.x + travel, ev.y, ev.z);
              if (!pp) continue;
              var k = pp.k;
              var sx = pp.sx;
              var sy = pp.sy;
              var fade = Math.min(1, ev.t * 0.5) * Math.max(0, 1 - (ev.t - 8) / 3);
              var pr = makeRng(Math.round(ev.x) * 31 + 7);
              for (var b = 0; b < 7; b++) {
                var rr = Math.min(70, (30 + pr.range(0, 26)) * k * unit * 3);
                var ox = pr.range(-1.1, 1.1) * rr;
                var oy = pr.range(-0.5, 0.35) * rr;
                ctx.globalAlpha = 0.1 * fade;
                ctx.drawImage(discFor(rr, false), sx + ox - rr, sy + oy - rr * 0.6, rr * 2, rr * 1.25);
              }
            }
          }
        }

        function drawEvents(list) {
          for (var i = 0; i < list.length; i++) {
            var evs = list[i].events;
            for (var e = 0; e < evs.length; e++) {
              var ev = evs[e];
              if (ev.kind === 'resonance') {
                var rr = makeRng(ev.seed);
                var lit = ev.fired > 0 ? ev.fired / 1.6 : 0;
                for (var t = 0; t < 9; t++) {
                  var tx = ev.x + rr.range(-26, 26);
                  var tz = ev.z + rr.range(-12, 12);
                  var len = rr.int(8, 20);
                  var kf = Math.max(0.05, F / (F + (tz - cam.z)));
                  var base = groundAt(tx + tz * 0.4);
                  for (var q = 0; q < len; q++) {
                    drawGrain(
                      {
                        x: tx + Math.sin(time * 1.6 + t + q * 0.2) * (q * 0.16) / kf,
                        y: base + (q * (GRAIN - 0.6)) / kf,
                        z: tz,
                        s: (GRAIN - 1.5) / kf,
                        a: 0.3 + lit * 0.55 - (q / len) * 0.15
                      },
                      lit > 0.4 && q > len - 4,
                      1
                    );
                  }
                }
              } else if (ev.kind === 'pluie') {
                for (var d = 0; d < ev.drops.length; d++) {
                  var dr = ev.drops[d];
                  var fade = dr.landed ? Math.max(0, 1 - dr.landed / 3) : 1;
                  if (fade <= 0) continue;
                  drawGrain({ x: dr.x, y: dr.y, z: dr.z, s: GRAIN - 2, a: fade }, true, 1);
                }
              }
            }
          }
        }

        /* --------------------------------------------- notes et créatures
         * Une note n'est plus un trait: c'est un objet posé au sol, avec sa
         * forme selon la voix. On le voit venir de loin, on marche dessus, il
         * sursaute, il s'allume — et il reste allumé. Le fil qui relie les
         * notes allumées dessine la partition au fur et à mesure.
         */
        function drawThread() {
          if (thread.length < 2) return;
          for (var i = 0; i < thread.length - 1; i++) {
            var a = thread[i];
            var b = thread[i + 1];
            var dx = b.x - a.x;
            if (Math.abs(dx) > 260) continue; // deux morceaux sans lien
            if (Math.max(a.x, b.x) < cam.x - 420 || Math.min(a.x, b.x) > cam.x + 420) continue;
            var steps2 = Math.max(2, Math.min(18, Math.round(Math.abs(dx) / 9)));
            for (var t = 1; t < steps2; t++) {
              var f = t / steps2;
              drawGrain(
                {
                  x: a.x + dx * f,
                  y: a.y + (b.y - a.y) * f + 1,
                  z: a.z + (b.z - a.z) * f,
                  s: GRAIN - 2.6,
                  a: 0.2
                },
                true,
                1
              );
            }
          }
        }

        function drawNotes(list) {
          var i, j;
          for (i = 0; i < list.length; i++) {
            var ns = list[i].notes;
            for (j = 0; j < ns.length; j++) {
              var n = ns[j];
              if (n.lit > 0) n.lit = Math.max(0, n.lit - 0.018);
              if (n.hop > 0) n.hop = Math.max(0, n.hop - 0.035);
              var kf = Math.max(0.05, F / (F + (n.z - cam.z)));
              var lift = Math.sin(n.hop * Math.PI) * 13; // le sursaut de l'objet
              var a0 = 0.5 + n.lit * 0.5;
              var head = n.on || n.lit > 0.02; // la tête s'allume et le reste
              var size = (GRAIN * 1.7) / kf;

              // Une ombre courte: sans elle, l'objet flotte au lieu d'être posé.
              var gp = project(n.x, n.y, n.z);
              if (gp.sx > -60 && gp.sx < W + 60) {
                var sh = size * kf * unit * 1.5;
                ctx.globalAlpha = 0.2;
                ctx.drawImage(discFor(Math.max(2, sh), false), gp.sx - sh, gp.sy - sh * 0.35, sh * 2, sh * 0.8);
              }

              if (n.kind === 'bell') {
                // Un anneau posé à plat, avec un cœur qui s'allume.
                for (var q = 0; q < 6; q++) {
                  var ang = (q / 6) * Math.PI * 2;
                  drawGrain(
                    {
                      x: n.x + Math.cos(ang) * 6,
                      y: n.y + lift,
                      z: n.z + Math.sin(ang) * 6,
                      s: size * 0.72,
                      a: a0
                    },
                    false,
                    1
                  );
                }
                if (head) drawGrain({ x: n.x, y: n.y + lift + 2, z: n.z, s: size * 0.8, a: 0.55 + n.lit * 0.45 }, true, 1);
              } else if (n.kind === 'bass') {
                // Une dalle large et basse, barrée de rouge une fois jouée.
                for (var d = -1; d <= 1; d++) {
                  drawGrain({ x: n.x + d * 7, y: n.y + lift, z: n.z, s: size, a: a0 }, false, 1);
                }
                if (head) {
                  drawGrain({ x: n.x, y: n.y + lift + GRAIN * 0.7 / kf, z: n.z, s: size * 0.75, a: 0.6 + n.lit * 0.4 }, true, 1);
                }
              } else {
                // Un clou: le pied dans la terre, la tête qui dépasse.
                drawGrain({ x: n.x, y: n.y + lift, z: n.z, s: size * 0.75, a: a0 * 0.85 }, false, 1);
                drawGrain(
                  { x: n.x, y: n.y + lift + (GRAIN * 1.3) / kf, z: n.z, s: size, a: head ? 0.62 + n.lit * 0.38 : a0 },
                  head,
                  1
                );
              }

              if (n.lit > 0.03) {
                var p = project(n.x, n.y + 7, n.z);
                var rad = (7 + (1 - n.lit) * 16) * kf * unit;
                ctx.globalAlpha = n.lit * 0.42;
                ctx.drawImage(discFor(Math.min(70, rad), true), p.sx - rad, p.sy - rad, rad * 2, rad * 2);
              }
            }
          }

          // L'onde qui s'ouvre au sol sous la note activée.
          for (i = pings.length - 1; i >= 0; i--) {
            var pg = pings[i];
            pg.r += 0.9;
            pg.life -= 0.02;
            if (pg.life <= 0) {
              pings.splice(i, 1);
              continue;
            }
            for (var w = 0; w < 10; w++) {
              var aw = (w / 10) * Math.PI * 2;
              drawGrain(
                {
                  x: pg.x + Math.cos(aw) * pg.r,
                  y: pg.y + 0.5,
                  z: pg.z + Math.sin(aw) * pg.r * 0.55,
                  s: GRAIN - 3,
                  a: pg.life * 0.55
                },
                true,
                1
              );
            }
          }
        }

        /* Six espèces, six silhouettes, six manières de bouger. La variété
         * tient à leur rareté autant qu'à leur dessin: on en croise une par
         * tableau, pas une par minute. */
        var SPECIES = [
          { shape: ['.#.', '###', '#.#'], move: 'tremble',
            voice: { base: 700, span: 700, q: 4, rate: 0.05, wave: 'triangle', up: 12, gain: 0.034 } },
          { shape: ['#.#', '###', '.#.'], move: 'immobile',
            voice: { base: 320, span: 380, q: 6, rate: 0.085, wave: 'sine', up: 0, gain: 0.04 } },
          { shape: ['.##', '##.', '.#.'], move: 'rampe',
            voice: { base: 900, span: 1400, q: 2.4, rate: 0.042, wave: 'square', up: 19, gain: 0.022 } },
          { shape: ['#.#', '.#.', '#.#'], move: 'flotte',
            voice: { base: 1200, span: 900, q: 7, rate: 0.07, wave: 'sine', up: 24, gain: 0.026 } },
          { shape: ['.#.', '#.#', '###', '.#.'], move: 'flotte',
            voice: { base: 480, span: 620, q: 3, rate: 0.062, wave: 'sawtooth', up: 7, gain: 0.024 } },
          { shape: ['##', '##'], move: 'rampe',
            voice: { base: 1500, span: 1100, q: 9, rate: 0.036, wave: 'square', up: 26, gain: 0.02 } }
        ];
        var CREATURE_SHAPES = [
          SPECIES[0].shape,
          SPECIES[1].shape,
          SPECIES[2].shape,
          SPECIES[3].shape
        ];

        function drawCreatures(list) {
          for (var i = 0; i < list.length; i++) {
            var cs = list[i].creatures;
            for (var j = 0; j < cs.length; j++) {
              var c = cs[j];
              var spec = SPECIES[c.shape % SPECIES.length];
              var shape = spec.shape;
              c.ph += 0.016 * (0.6 + c.mood * 3);
              if (spec.move === 'flotte') c.y = c.base + 10 + Math.sin(c.ph * 0.7) * 6;
              else if (spec.move === 'rampe') c.x = c.baseX + Math.sin(c.ph * 0.35) * 9;

              var p = project(c.x, c.y + GRAIN * 3, c.z);
              if (p.sx < -120 || p.sx > W + 120) continue;
              var kf = p.k;
              var cell = GRAIN * unit * kf;
              var jitter = c.mood * (spec.move === 'tremble' ? 2.2 : 0.7);
              var breathe = Math.sin(c.ph) > 0.6 ? 1 : 0;

              ctx.globalAlpha = 0.24;
              var groundPt = project(c.x, c.y, c.z);
              ctx.drawImage(
                discFor(9, false),
                p.sx - cell * 2.4,
                groundPt.sy - cell * 0.8,
                cell * 4.8,
                cell * 1.7
              );

              ctx.globalAlpha = 0.92;
              ctx.fillStyle = act.ink;
              var side = Math.max(2, Math.round(cell * 0.84));
              for (var row = 0; row < shape.length; row++) {
                for (var col = 0; col < shape[row].length; col++) {
                  if (shape[row][col] !== '#') continue;
                  var ox = Math.sin(c.ph * 7 + row) * jitter;
                  var gx = Math.round(p.sx + (col - 1) * cell + ox - side / 2);
                  var gy = Math.round(p.sy + (row + breathe * 0.12) * cell);
                  ctx.fillRect(gx, gy, side, side);
                }
              }

              // La marque rouge: elle veut parler. Elle s'éteint une fois dit.
              if (!c.done) {
                var pulse = 0.55 + 0.45 * Math.sin(time * 2.2 + c.ph);
                var rad = (5 + pulse * 4) * kf * unit;
                ctx.globalAlpha = 0.35 + pulse * 0.3;
                ctx.drawImage(discFor(rad, true), p.sx - rad, p.sy - cell * 2.4 - rad, rad * 2, rad * 2);
              }
            }
          }
        }

        function updateCreatures() {
          nearCreature = null;
          var list = visibleChunks();
          var best = 999;
          for (var i = 0; i < list.length; i++) {
            var cs = list[i].creatures;
            for (var j = 0; j < cs.length; j++) {
              var c = cs[j];
              if (c.done) continue;
              var d = Math.abs(c.x - hero.x) + Math.abs(c.z - hero.z) * 0.6;
              if (d < best) {
                best = d;
                nearCreature = c;
              }
            }
          }
          // Assez près: elle engage la conversation d'elle-même.
          if (nearCreature && best < 24 && !talkOpen && !pendingAsk) openTalk(nearCreature);
        }

        /* ------------------------------------------- partition et objectif */
        var ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];

        function buildScoreMenu() {
          hud.score.innerHTML = '<h2>la partition</h2>';
          for (var i = 0; i < ACTS.length; i++) {
            (function (idx) {
              var b = document.createElement('button');
              b.type = 'button';
              if (idx === actIndex) b.className = 'here';
              var n = document.createElement('span');
              n.className = 'n';
              n.textContent = ROMAN[idx];
              var w = document.createElement('span');
              w.textContent = ACTS[idx].word;
              b.appendChild(n);
              b.appendChild(w);
              b.addEventListener('click', function () {
                jumpToAct(idx);
              });
              hud.score.appendChild(b);
            })(i);
          }
        }

        function jumpToAct(i) {
          // On reste dans le même cycle de tableaux: la partition boucle, le
          // monde continue tout droit.
          var cycle = ACT_LEN * ACTS.length;
          var base = Math.floor(hero.x / cycle) * cycle;
          hero.x = base + i * ACT_LEN + 70;
          hero.prevX = hero.x;
          hero.z = 0;
          hero.vx = 0;
          hero.vz = 0;
          cam.x = hero.x;
          cam.z = 0;
          applyAct(i, true);
          hud.score.classList.remove('open');
          markInteracted();
        }

        /* ------------------------------------------------------- entrées */
        function markInteracted() {
          if (interacted) return;
          interacted = true;
          caption.classList.add('gone');
        }

        var lastPointer = { x: 0, y: 0 };

        function localPoint(e) {
          var r = canvas.getBoundingClientRect();
          return { x: e.clientX - r.left, y: e.clientY - r.top };
        }

        stage.addEventListener('pointerdown', function (e) {
          markInteracted();
          Sound.unlock();
          if (e.target && e.target.tagName === 'BUTTON') return;
          var pt = localPoint(e);
          held = pt;
          lastPointer = pt;
          try {
            stage.setPointerCapture(e.pointerId);
          } catch (err) {
            /* certains navigateurs refusent la capture: sans importance */
          }
        });
        stage.addEventListener('pointermove', function (e) {
          var pt = localPoint(e);
          if (pendingAsk) {
            // Frotter l'écran vaut caresse — et remplace les capteurs sur un
            // ordinateur, pour que la demande reste franchissable partout.
            if (pendingAsk.type === 'caress' || pendingAsk.type === 'shake' || pendingAsk.type === 'tilt') {
              var d = Math.hypot(pt.x - lastPointer.x, pt.y - lastPointer.y);
              if (d > 1) feedAsk(Math.min(0.05, d * 0.0018));
            }
          }
          lastPointer = pt;
          if (held) held = pt;
        });
        function release() {
          held = null;
        }
        stage.addEventListener('pointerup', release);
        stage.addEventListener('pointercancel', release);
        stage.addEventListener('pointerleave', release);

        window.addEventListener('keydown', function (e) {
          keys[e.code] = true;
          Sound.unlock();
          if (e.code.indexOf('Arrow') === 0) e.preventDefault();
          markInteracted();
        });
        window.addEventListener('keyup', function (e) {
          keys[e.code] = false;
        });

        hud.btnScore.addEventListener('click', function () {
          Sound.unlock();
          markInteracted();
          Sound.digital(!hud.score.classList.contains('open'));
          if (hud.score.classList.contains('open')) {
            hud.score.classList.remove('open');
            return;
          }
          buildScoreMenu();
          hud.score.classList.add('open');
        });

        hud.btnCam.addEventListener('click', function () {
          Sound.unlock();
          markInteracted();
          camMode = (camMode + 1) % 3;
          hud.btnCam.textContent = '◉ ' + CAM_NAMES[camMode];
          Sound.digital(true);
        });

        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', function () {
          setTimeout(resize, 120);
        });
        if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(stage);

        /* -------------------------------------------------------- départ */
        var last = 0;
        var fpsSamples = [];
        function loop(now) {
          var dt = Math.min(0.05, (now - last) / 1000 || 0);
          last = now;
          if (dt > 0) fpsSamples.push(1 / dt);
          if (fpsSamples.length > 120) fpsSamples.shift();
          update(dt);
          updateWeather(dt);
          updateEvents(dt);
          updateCreatures();
          render(dt);
          requestAnimationFrame(loop);
        }

        resize();
        buildDiscs();
        buildNoise();
        hero.x = 40;
        hero.prevX = 40;
        cam.x = 40;
        paintPhrase();
        restyleInk();
        applyAct(actIndexAt(hero.x), false);
        setTimeout(function () {
          announce(act.word);
        }, 1200);
        window.__grain = {
          fps: function () {
            var s = 0;
            for (var i = 0; i < fpsSamples.length; i++) s += fpsSamples[i];
            return Math.round(s / Math.max(1, fpsSamples.length));
          },
          state: function () {
            return {
              heroX: Math.round(hero.x),
              heroZ: Math.round(hero.z),
              focusZ: Math.round(focusZ),
              steps: steps,
              fragments: fragments.length,
              acte: act.word,
              touchees: touched.size,
              fil: thread.length,
              talk: talkOpen ? talk.script.who + ':' + talk.node : null,
              ask: pendingAsk ? pendingAsk.type + ':' + pendingAsk.progress.toFixed(2) : null,
              near: nearCreature ? Math.round(Math.abs(nearCreature.x - hero.x)) : -1,
              audio: Sound.ready(),
              chunks: chunks.size
            };
          },
          dive: function (dz) {
            keys['ArrowUp'] = dz > 0;
            keys['ArrowDown'] = dz < 0;
          },
          goToCreature: function () {
            var list = visibleChunks();
            for (var i = 0; i < list.length; i++) {
              for (var j = 0; j < list[i].creatures.length; j++) {
                var c = list[i].creatures[j];
                if (c.done) continue;
                hero.x = c.x - 12;
                hero.z = c.z;
                cam.x = hero.x;
                return Math.round(c.x);
              }
            }
            return null;
          },
          choose: function (i) {
            var b = hud.choices.getElementsByTagName('button');
            if (b[i || 0]) b[i || 0].click();
            return b.length;
          },
          jump: function (i) {
            jumpToAct(i);
            return act.word;
          },
          cam: function (m) {
            camMode = m % 3;
            hud.btnCam.textContent = '◉ ' + CAM_NAMES[camMode];
            return CAM_NAMES[camMode];
          },
          strike: function () {
            strike();
          },
          flash: function () {
            return weather.flash;
          },
          notes: function () {
            return { touched: touched.size, thread: thread.length };
          },
          rub: function (n) {
            for (var i = 0; i < (n || 40); i++) feedAsk(0.05);
          },
          walk: function (dir) {
            keys['ArrowRight'] = dir > 0;
            keys['ArrowLeft'] = dir < 0;
          }
        };
        last = performance.now();
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
